# The core's own regression tests, built from the tree's objects, no GPU.
#
# check-angrylion: the vector emitter and generated pipeline stage checks.
# check-core: the HLE geometry frontend's lanes (clip scratch stability,
# the Fast3D near clip plane read from the microcode data segment), the
# core's bounds, exception, input and MusyX checks, parallel-RDP's
# temporal upscaler geometry and the GLideN64/Glide64 unit tests.
# check-dd-ipl: a 64DD disk booted through the core with no IPL ROM.
# check-savestate-latch: a savestate saved and loaded back with each CPU
# core. check-savestate-code: cached code across a state loaded back in
# session and under run-ahead.
#
# The ThreadSanitizer leg runs parallel-RDP and the parallel RSP on
# lavapipe, natively and at 2x; races inside lavapipe and LLVM are
# suppressed (tools/ci/tsan_lavapipe.supp), none in the core are. The
# renderer once read pages back from host RDRAM ordered only by a fence,
# which thread sanitizers cannot see.
name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-checks:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAKEFLAGS: --no-print-directory
      CORE_FLAGS: platform=unix WITH_DYNAREC=x86_64 HAVE_THR_AL=1 HAVE_PARALLEL=1 HAVE_PARALLEL_RSP=1
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential nasm git ca-certificates curl python3 libgl-dev

      - name: Build
        run: make -j$(nproc) $CORE_FLAGS

      - name: angrylion
        run: make platform=unix check-angrylion

      - name: Core unit tests
        run: make platform=unix check-core

      - name: 64DD with no IPL ROM
        run: make platform=unix check-dd-ipl

      - name: Savestates with each CPU core
        run: make platform=unix check-savestate-latch

      - name: Cached code across savestates
        run: make platform=unix check-savestate-code

  tsan:
    name: parallel-RDP under ThreadSanitizer (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAKEFLAGS: --no-print-directory
      CORE_FLAGS: platform=unix WITH_DYNAREC=x86_64 HAVE_THR_AL=1 HAVE_PARALLEL=1 HAVE_PARALLEL_RSP=1 HAVE_OPENGL=0
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential nasm git ca-certificates curl python3 \
            mesa-vulkan-drivers libvulkan1 libgl-dev

      # ThreadSanitizer cannot map its shadow with the runner kernel's
      # 32 bits of mmap randomization
      - name: Narrow mmap randomization
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build
        run: |
          make -j$(nproc) $CORE_FLAGS SANITIZER=thread
          make platform=unix HAVE_PARALLEL=1 SANITIZER=thread lrhost_vk

      - name: cube16, native and 2x
        run: |
          python3 -c "import sys; sys.path.insert(0, 'tools/ci'); from parallel_rdp_regress import fetch; fetch('krom-roms', 'cube16')"
          for scale in 1x 2x; do
            TSAN_OPTIONS="halt_on_error=1 suppressions=tools/ci/tsan_lavapipe.supp" ./lrhost_vk ./parallel_n64_libretro.so krom-roms/cube16.n64 10 \
              parallel-n64-gfxplugin=parallel parallel-n64-rspplugin=parallel parallel-n64-cpucore=cached_interpreter parallel-n64-upscaling=$scale || exit 1
          done

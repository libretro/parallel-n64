# The OpenGL renderers on Mesa's llvmpipe through headless EGL, no GPU,
# as the GitLab test-gl-renderers-linux-x64 job runs them.
#
# tools/lrhost_gl runs krom's RDP tests through Glide64, GLideN64, Rice
# and glN64 (tools/ci/gl_renderers.py): each must run to the end and draw;
# GLideN64 must draw the same frames whatever its colour buffer copy to
# RDRAM is set to, and the same frames with its vertex rings shrunk
# (GLIDEN64_RING_BYTES) as with the full ones, both through persistent
# mapped rings and through glMapBufferRange. The small rings go round many
# times in a test this short: GLideN64 used to draw torn, garbage
# geometry once its draws moved to the ring's second segment, and the
# full ring never got there in CI. check-core holds the ring's placement
# and the element the draws index from to what was written
# (test_gliden64_ring_segments). test_glsm_draw_target(_gles) holds the
# frame Glide64, Rice and glN64 swap to the one the frontend presents,
# not the next one they go on to draw over it, through the blit and
# through GLES 2's texture copy; test_glsm_state(_gles) holds the GL
# state glsm restores for the core to what the core set; the Glitch64 tests hold its LFB write
# and texture uploads. The sanitize leg runs it all again with
# AddressSanitizer and UndefinedBehaviorSanitizer: any report fails.
name: GL renderers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gl-renderers:
    name: GL renderers (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            sanitizer: ""
            sanitizer_env: ""
          - name: asan-ubsan
            sanitizer: address,undefined
            sanitizer_env: ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
    env:
      MAKEFLAGS: --no-print-directory
      CORE_FLAGS: platform=unix WITH_DYNAREC=x86_64 HAVE_THR_AL=1 HAVE_PARALLEL=0 HAVE_PARALLEL_RSP=0
      GL_TESTS: test_glitch64_lfb_write test_glitch64_textures test_glitch64_textures_gles test_glsm_draw_target test_glsm_draw_target_gles test_glsm_state test_glsm_state_gles
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential nasm git ca-certificates curl python3 \
            libgl-dev libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri

      - name: Ring unit test
        run: |
          make platform=unix test_gliden64_ring_segments
          ./test_gliden64_ring_segments

      - name: Build core and hosts
        run: |
          make -j$(nproc) $CORE_FLAGS SANITIZER=${{ matrix.sanitizer }}
          make platform=unix SANITIZER=${{ matrix.sanitizer }} lrhost_gl $GL_TESTS

      - name: GL unit tests
        run: |
          for t in $GL_TESTS; do env EGL_PLATFORM=surfaceless ${{ matrix.sanitizer_env }} ./$t || exit 1; done
          python3 tools/test_glsm_frame_boundary.py

      - name: krom ROMs cache
        uses: actions/cache@v4
        with:
          path: krom-roms
          key: krom-roms-${{ hashFiles('tools/ci/parallel_rdp_regress.py') }}

      - name: GL renderers lane
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/gl_renderers.py --core ./parallel_n64_libretro.so --host ./lrhost_gl

      - name: GLideN64 combiner key journal
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/gliden64_keys_journal.py --core ./parallel_n64_libretro.so --host ./lrhost_gl

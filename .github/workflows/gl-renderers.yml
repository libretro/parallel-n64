# The OpenGL renderers on Mesa's llvmpipe through headless EGL, no GPU.
#
# check_vtables.py fails on a class that declares a virtual function
# nobody defines (GCC 16's MinGW link failed on two such Rice classes).
# tools/lrhost runs krom's tests through angrylion with and without a lent
# software framebuffer, for each VI output: the pictures must match, and
# the modes that can draw into the lent buffer must.
#
# tools/lrhost_gl runs krom's RDP tests through Glide64, GLideN64, Rice
# and glN64 (tools/ci/gl_renderers.py): each must run to the end and draw;
# GLideN64 must draw the same frames whatever its colour buffer copy to
# RDRAM is set to, and the same frames with its vertex rings shrunk
# (GLIDEN64_RING_BYTES) as with the full ones, both through persistent
# mapped rings and through glMapBufferRange. The small rings go round many
# times in a test this short: GLideN64 used to draw torn, garbage
# geometry once its draws moved to the ring's second segment, and the
# full ring never got there in CI. check-core holds the ring's placement
# and the element the draws index from to what was written
# (test_gliden64_ring_segments), and the drawers' draws to what they
# were given, on a GL stub (test_gliden64_gl_drawer). test_glsm_draw_target(_gles) holds the
# frame Glide64, Rice and glN64 swap to the one the frontend presents,
# not the next one they go on to draw over it, through the blit and
# through GLES 2's texture copy; test_glsm_state(_gles) holds the GL
# state glsm restores for the core to what the core set; the Glitch64 tests hold its LFB write
# and texture uploads. The sanitize leg runs it all again with
# AddressSanitizer and UndefinedBehaviorSanitizer: any report fails.
name: GL renderers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gl-renderers:
    name: GL renderers (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            sanitizer: ""
            sanitizer_env: ""
            vulkan_scope: ""
          - name: asan-ubsan
            sanitizer: address,undefined
            sanitizer_env: ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
            vulkan_scope: --quick
    env:
      MAKEFLAGS: --no-print-directory
      CORE_FLAGS: platform=unix WITH_DYNAREC=x86_64 HAVE_THR_AL=1 HAVE_PARALLEL=0 HAVE_PARALLEL_RSP=0
      GL_TESTS: test_glitch64_lfb_write test_glitch64_draw test_glitch64_readback test_glitch64_textures test_glitch64_textures_gles test_glitch64_depth_image test_glitch64_depth_image_gles test_glitch64_n64_combiner test_glitch64_n64_combiner_gles test_glsm_draw_target test_glsm_draw_target_gles test_glsm_state test_glsm_state_gles
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential nasm git ca-certificates curl python3 \
            libgl-dev libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 spirv-tools

      - name: Virtual functions defined
        if: matrix.sanitizer == ''
        run: python3 tools/ci/check_vtables.py

      - name: Ring and drawer unit tests
        run: |
          make platform=unix test_gliden64_ring_segments test_gliden64_gl_drawer
          ./test_gliden64_ring_segments
          ./test_gliden64_gl_drawer

      - name: Build core and hosts
        run: |
          make -j$(nproc) $CORE_FLAGS SANITIZER=${{ matrix.sanitizer }}
          make platform=unix SANITIZER=${{ matrix.sanitizer }} lrhost_gl lrhost $GL_TESTS

      - name: GL unit tests
        run: |
          for t in $GL_TESTS; do env EGL_PLATFORM=surfaceless ${{ matrix.sanitizer_env }} ./$t || exit 1; done
          python3 tools/test_glsm_frame_boundary.py

      - name: krom ROMs cache
        uses: actions/cache@v4
        with:
          path: krom-roms
          key: krom-roms-${{ hashFiles('tools/ci/parallel_rdp_regress.py') }}

      - name: GL renderers lane
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/gl_renderers.py --core ./parallel_n64_libretro.so --host ./lrhost_gl

      - name: GLideN64 combiner key journal
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/gliden64_keys_journal.py --core ./parallel_n64_libretro.so --host ./lrhost_gl

      - name: GLideN64 ubershader
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/gliden64_ubershader.py --core ./parallel_n64_libretro.so --host ./lrhost_gl
      - name: Combiners known at load
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/combiner_warm_start.py --core ./parallel_n64_libretro.so --host ./lrhost_gl

      - name: GLideN64 SPIR-V
        run: |
          make platform=unix test_gliden64_spirv
          ./test_gliden64_spirv
          make platform=unix check_gliden64_c89

      - name: GLideN64 on Vulkan
        run: |
          make platform=unix HAVE_PARALLEL=1 SANITIZER=${{ matrix.sanitizer }} lrhost_vk
          env ${{ matrix.sanitizer_env }} python3 tools/ci/gliden64_vulkan.py --core ./parallel_n64_libretro.so --gl ./lrhost_gl --vk ./lrhost_vk ${{ matrix.vulkan_scope }}

      - name: GLideN64 display lists through the HLE RSP
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/gliden64_hle_dl.py --core ./parallel_n64_libretro.so --gl ./lrhost_gl --vk ./lrhost_vk --glide64

      - name: Glide64 RDP trapezoids
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/glide64_lle_trapezoid.py --core ./parallel_n64_libretro.so --gl ./lrhost_gl --vk ./lrhost_vk

      - name: Glide64's blender against angrylion's
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/glide64_blender.py --core ./parallel_n64_libretro.so --gl ./lrhost_gl --vk ./lrhost_vk

      - name: Glide64's second texel converted from the first, against angrylion's
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/glide64_convert.py --core ./parallel_n64_libretro.so --gl ./lrhost_gl --vk ./lrhost_vk

      - name: Glide64's frame copied to RDRAM, Vulkan as GL
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/glide64_fb_copy.py --core ./parallel_n64_libretro.so --gl ./lrhost_gl --vk ./lrhost_vk

      - name: GLideN64 on Vulkan for the frontend's temporal upscaler
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/gliden64_upscaler.py --core ./parallel_n64_libretro.so --vk ./lrhost_vk

      - name: angrylion into a lent framebuffer
        run: env ${{ matrix.sanitizer_env }} python3 tools/ci/angrylion_lend.py --core ./parallel_n64_libretro.so --host ./lrhost

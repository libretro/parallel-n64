# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

# Core definitions
.core-defs:
  variables:
    CORENAME: parallel_n64

# Inclusion templates, required for the build to work
include:
  ################################## DESKTOPS ################################
  # Windows 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'
    
  # Windows 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-i686-mingw.yml'
    
  # Linux 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'

  # Linux 64-bit (ARM64)
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-aarch64.yml'

  # Linux 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-i686.yml'

  # MacOS 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-x64.yml'

  # MacOS arm 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-arm64.yml'

  ################################## CELLULAR ################################
  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-jni.yml'

  # iOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/ios-arm64.yml'

  # iOS (armv7)
  - project: 'libretro-infrastructure/ci-templates'
    file: '/ios9.yml'

  ################################## CONSOLES ################################
    
  #################################### MISC ##################################
  # webOS 32-bit (LGTV)
  - project: 'libretro-infrastructure/ci-templates'
    file: '/webos-make.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared
  - build-static

##############################################################################
#################################### STAGES ##################################
##############################################################################

################################### DESKTOPS #################################
# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .core-defs
    - .libretro-windows-x64-mingw-make-default
  variables:
    WITH_DYNAREC: x86_64
    HAVE_THR_AL: 1
    HAVE_PARALLEL: 1
    HAVE_PARALLEL_RSP: 1

# Windows 32-bit
libretro-build-windows-i686:
  extends:
    - .libretro-windows-i686-mingw-make-default
    - .core-defs
  variables:
    WITH_DYNAREC: x86
    HAVE_THR_AL: 1
    HAVE_PARALLEL: 1
    HAVE_PARALLEL_RSP: 1
    
# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .core-defs
    - .libretro-linux-x64-make-default
  variables:
    WITH_DYNAREC: x86_64
    HAVE_THR_AL: 1
    HAVE_PARALLEL: 1
    HAVE_PARALLEL_RSP: 1

# Linux 64-bit: angrylion and core self-tests. Runs on the same image as
# the desktop build and links the tree's own objects: the vector emitter and
# generated pipeline stage checks, the HLE geometry frontend's regression
# lanes (clip scratch stability, the Fast3D near clip plane read from the
# microcode data segment), the core's bounds, exception, input and
# MusyX checks and parallel-RDP's temporal upscaler geometry (make
# check-core), and a 64DD disk booted through the core
# with no IPL ROM (make check-dd-ipl), and a savestate saved and loaded
# back with each CPU core (make check-savestate-latch), and cached code
# across a state loaded back in session and under run-ahead
# (make check-savestate-code).
test-angrylion-linux-x64:
  extends:
    - .core-defs
    - .libretro-linux-x64-make-default
  variables:
    WITH_DYNAREC: x86_64
    HAVE_THR_AL: 1
    HAVE_PARALLEL: 1
    HAVE_PARALLEL_RSP: 1
  script:
    - make -j$(nproc) platform=unix WITH_DYNAREC=$WITH_DYNAREC HAVE_THR_AL=$HAVE_THR_AL HAVE_PARALLEL=$HAVE_PARALLEL HAVE_PARALLEL_RSP=$HAVE_PARALLEL_RSP
    - make platform=unix check-angrylion
    - make platform=unix check-core
    - make platform=unix check-dd-ipl
    - make platform=unix check-savestate-latch
    - make platform=unix check-savestate-code

# Linux 64-bit: parallel-rdp on Mesa's software Vulkan driver (lavapipe),
# no GPU. tools/lrhost_vk runs krom's RDP tests through the core and every
# dumped frame is compared with tools/ci/parallel_rdp_expected.json, with
# threaded and single-threaded command processing, for Vulkan negotiation
# v2 (through the frontend's device wrapper) and v1, with the shader
# variants for devices without 8-bit SSBO storage, at 2x, and for a
# frontend temporal upscaler (jitter, motion vectors, depth); upscaled and
# downscaled frames must be the upscaled ones halved as a blit halves them,
# every byte; and with 128 MiB storage buffer bindings each upscaling
# setting must render at the factor that fits. The shader
# bank check needs no GPU: those variants must not use 8-bit storage; nor
# does the upscaler shaders' check: the SPIR-V committed must be current.
# A second session must build ahead the pipelines the first one built, on
# the worker and none on the frame's threads, and the frames must not
# depend on how RDRAM is uploaded (the ROMs a frontend's writes show in,
# one more, and the partly written chunks: the whole lane takes 20 minutes).
test-parallel-rdp-linux-x64:
  extends:
    - .core-defs
    - .libretro-linux-x64-make-default
  variables:
    WITH_DYNAREC: x86_64
    HAVE_THR_AL: 1
    HAVE_PARALLEL: 1
    HAVE_PARALLEL_RSP: 1
    HAVE_OPENGL: 0
    VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    DEBIAN_FRONTEND: noninteractive
  # The libretro x64 image is xenial: its Mesa 18 predates lavapipe
  # (Mesa 21) and its Python has no CA store. A current Ubuntu has both.
  image: ubuntu:24.04
  script:
    - apt-get update -qq && apt-get install -y -qq build-essential nasm git ca-certificates curl python3 mesa-vulkan-drivers libvulkan1 libgl-dev spirv-tools vulkan-validationlayers
    - make -j$(nproc) platform=unix WITH_DYNAREC=$WITH_DYNAREC HAVE_THR_AL=$HAVE_THR_AL HAVE_PARALLEL=$HAVE_PARALLEL HAVE_OPENGL=$HAVE_OPENGL HAVE_PARALLEL_RSP=$HAVE_PARALLEL_RSP
    - make platform=unix HAVE_PARALLEL=$HAVE_PARALLEL lrhost_vk
    - python3 tools/rdp_no_storage_8bit_bank.py --check
    - python3 tools/ci/check_cxx_runtime.py
    - python3 tools/ci/check_stale_deps.py
    - python3 tools/gen_upscaler_shaders.py --check
    - python3 tools/ci/parallel_rdp_regress.py --core ./parallel_n64_libretro.so --host ./lrhost_vk --out parallel-rdp-artifacts
    - python3 tools/ci/parallel_rdp_syncval.py --core ./parallel_n64_libretro.so --host ./lrhost_vk
    - python3 tools/ci/parallel_rdp_downscale.py --core ./parallel_n64_libretro.so --host ./lrhost_vk
    - python3 tools/ci/parallel_rdp_binding_fit.py --core ./parallel_n64_libretro.so --host ./lrhost_vk
    - python3 tools/ci/parallel_rdp_pipelines.py --core ./parallel_n64_libretro.so --host ./lrhost_vk --roms krom-roms
    - python3 tools/ci/parallel_rdp_rdram.py --core ./parallel_n64_libretro.so --host ./lrhost_vk --roms krom-roms
  artifacts:
    when: on_failure
    paths:
      - parallel-rdp-artifacts

# Linux 64-bit: parallel-rdp and the parallel RSP under ThreadSanitizer, on
# lavapipe, natively and at 2x; races inside lavapipe and LLVM are
# suppressed (tools/ci/tsan_lavapipe.supp), none in the core are. The
# renderer once read pages back from host RDRAM ordered only by a fence,
# which thread sanitizers cannot see.
test-parallel-rdp-tsan-linux-x64:
  extends:
    - .core-defs
    - .libretro-linux-x64-make-default
  variables:
    WITH_DYNAREC: x86_64
    HAVE_THR_AL: 1
    HAVE_PARALLEL: 1
    HAVE_PARALLEL_RSP: 1
    HAVE_OPENGL: 0
    VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    DEBIAN_FRONTEND: noninteractive
  image: ubuntu:24.04
  script:
    - apt-get update -qq && apt-get install -y -qq build-essential nasm git ca-certificates curl python3 mesa-vulkan-drivers libvulkan1 libgl-dev
    - make -j$(nproc) platform=unix WITH_DYNAREC=$WITH_DYNAREC HAVE_THR_AL=$HAVE_THR_AL HAVE_PARALLEL=$HAVE_PARALLEL HAVE_OPENGL=$HAVE_OPENGL HAVE_PARALLEL_RSP=$HAVE_PARALLEL_RSP SANITIZER=thread
    - make platform=unix HAVE_PARALLEL=$HAVE_PARALLEL SANITIZER=thread lrhost_vk
    - python3 -c "import sys; sys.path.insert(0, 'tools/ci'); from parallel_rdp_regress import fetch; fetch('krom-roms', 'cube16')"
    - for scale in 1x 2x; do TSAN_OPTIONS="halt_on_error=1 suppressions=tools/ci/tsan_lavapipe.supp" ./lrhost_vk ./parallel_n64_libretro.so krom-roms/cube16.n64 10 parallel-n64-gfxplugin=parallel parallel-n64-rspplugin=parallel parallel-n64-cpucore=cached_interpreter parallel-n64-upscaling=$scale || exit 1; done

# Linux 64-bit: the OpenGL renderers on Mesa's llvmpipe through headless
# EGL, no GPU. tools/lrhost_gl runs krom's RDP tests through Glide64,
# GLideN64, Rice and glN64: each must run to the end and draw, and
# GLideN64 must draw the same frames whatever its colour buffer copy to
# RDRAM is set to, and the same with its vertex rings shrunk so they go
# round (the draws used to read the wrong vertices past the first
# segment). .github/workflows/gl-renderers.yml runs the same lane. check_vtables.py fails on a class that declares a
# virtual function nobody defines (GCC 16's MinGW link failed on two such
# Rice classes). test_glitch64_lfb_write holds Glide64's LFB write to
# the image it was given, and test_glitch64_textures(_gles) its texture
# uploads, on GL and on GLES 2, to what each Glide format means.
# test_glsm_draw_target(_gles) holds the frame Glide64, Rice and glN64
# swap to the one the frontend presents, through the blit and through
# GLES 2's texture copy, and test_glsm_state(_gles) the GL state glsm
# restores for the core to what the core set. tools/lrhost runs them through angrylion with and
# without a lent software framebuffer, for each VI output: the pictures
# must match, and the modes that can draw into the lent buffer must. Then
# both again with the core and hosts built with AddressSanitizer and
# UndefinedBehaviorSanitizer: any report fails the lane.
test-gl-renderers-linux-x64:
  extends:
    - .core-defs
    - .libretro-linux-x64-make-default
  variables:
    WITH_DYNAREC: x86_64
    HAVE_THR_AL: 1
    HAVE_PARALLEL: 0
    HAVE_PARALLEL_RSP: 0
    DEBIAN_FRONTEND: noninteractive
  image: ubuntu:24.04
  script:
    - apt-get update -qq && apt-get install -y -qq build-essential nasm git ca-certificates curl python3 libgl-dev libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 spirv-tools
    - make -j$(nproc) platform=unix WITH_DYNAREC=$WITH_DYNAREC HAVE_THR_AL=$HAVE_THR_AL HAVE_PARALLEL=$HAVE_PARALLEL HAVE_PARALLEL_RSP=$HAVE_PARALLEL_RSP
    - python3 tools/ci/check_vtables.py
    - make platform=unix lrhost_gl lrhost test_glitch64_lfb_write test_glitch64_textures test_glitch64_textures_gles test_glsm_draw_target test_glsm_draw_target_gles test_glsm_state test_glsm_state_gles
    - for t in test_glitch64_lfb_write test_glitch64_textures test_glitch64_textures_gles test_glsm_draw_target test_glsm_draw_target_gles test_glsm_state test_glsm_state_gles; do EGL_PLATFORM=surfaceless ./$t || exit 1; done
    - python3 tools/test_glsm_frame_boundary.py
    - python3 tools/ci/gl_renderers.py --core ./parallel_n64_libretro.so --host ./lrhost_gl
    - python3 tools/ci/gliden64_keys_journal.py --core ./parallel_n64_libretro.so --host ./lrhost_gl
    - python3 tools/ci/gliden64_ubershader.py --core ./parallel_n64_libretro.so --host ./lrhost_gl
    - make platform=unix HAVE_PARALLEL=1 lrhost_vk test_gliden64_spirv
    - ./test_gliden64_spirv
    - python3 tools/ci/gliden64_vulkan.py --core ./parallel_n64_libretro.so --gl ./lrhost_gl --vk ./lrhost_vk
    - python3 tools/ci/angrylion_lend.py --core ./parallel_n64_libretro.so --host ./lrhost
    - make platform=unix clean
    - make -j$(nproc) platform=unix WITH_DYNAREC=$WITH_DYNAREC HAVE_THR_AL=$HAVE_THR_AL HAVE_PARALLEL=$HAVE_PARALLEL HAVE_PARALLEL_RSP=$HAVE_PARALLEL_RSP SANITIZER=address,undefined
    - make platform=unix HAVE_PARALLEL=1 SANITIZER=address,undefined lrhost_vk
    - make platform=unix SANITIZER=address,undefined lrhost_gl lrhost test_glitch64_lfb_write test_glitch64_textures test_glitch64_textures_gles test_glsm_draw_target test_glsm_draw_target_gles test_glsm_state test_glsm_state_gles
    - for t in test_glitch64_lfb_write test_glitch64_textures test_glitch64_textures_gles test_glsm_draw_target test_glsm_draw_target_gles test_glsm_state test_glsm_state_gles; do EGL_PLATFORM=surfaceless ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ./$t || exit 1; done
    - ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 python3 tools/ci/gl_renderers.py --core ./parallel_n64_libretro.so --host ./lrhost_gl
    - ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 python3 tools/ci/gliden64_keys_journal.py --core ./parallel_n64_libretro.so --host ./lrhost_gl
    - ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 python3 tools/ci/gliden64_ubershader.py --core ./parallel_n64_libretro.so --host ./lrhost_gl
    - ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 python3 tools/ci/gliden64_vulkan.py --core ./parallel_n64_libretro.so --gl ./lrhost_gl --vk ./lrhost_vk --quick
    - ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 python3 tools/ci/angrylion_lend.py --core ./parallel_n64_libretro.so --host ./lrhost

# Linux 64-bit (ARM64)
libretro-build-linux-aarch64:
  extends:
    - .core-defs
    - .libretro-linux-aarch64-make-default
  variables:
    WITH_DYNAREC: aarch64
    HAVE_THR_AL: 1
    HAVE_PARALLEL: 1
    HAVE_PARALLEL_RSP: 1

# Linux 32-bit
libretro-build-linux-i686:
  extends:
    - .core-defs
    - .libretro-linux-i686-make-default
  variables:
    WITH_DYNAREC: i686
    HAVE_THR_AL: 1
    HAVE_PARALLEL: 1
    HAVE_PARALLEL_RSP: 1

# MacOS 64-bit
libretro-build-osx-x64:
  extends:
    - .libretro-osx-x64-make-default
    - .core-defs
  variables:
    HAVE_THR_AL: 1

# MacOS arm64
libretro-build-osx-arm64:
  extends:
    - .libretro-osx-arm64-make-default
    - .core-defs
  variables:
    HAVE_THR_AL: 1
    WITH_DYNAREC: aarch64

################################### CELLULAR #################################
# Android ARMv7a
android-armeabi-v7a:
  extends:
    - .libretro-android-jni-armeabi-v7a
    - .core-defs

# Android ARMv8a
android-arm64-v8a:
  extends:
    - .libretro-android-jni-arm64-v8a
    - .core-defs

# Android 64-bit x86
android-x86_64:
  extends:
    - .libretro-android-jni-x86_64
    - .core-defs

# Android 32-bit x86
android-x86:
  extends:
    - .libretro-android-jni-x86
